# Day2：本地依赖（Postgres + Redis）
# 用法：在项目根目录执行 docker compose up -d

services:
  postgres:
    image: postgres:16
    container_name: reviewbot-postgres
    environment:
      POSTGRES_USER: reviewbot
      POSTGRES_PASSWORD: reviewbot
      POSTGRES_DB: reviewbot
    ports:
      # 宿主机 5432 -> 容器 5432，Go 程序连 localhost:5432
      - "5432:5432"
    volumes:
      - reviewbot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewbot -d reviewbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: reviewbot-redis
    ports:
      - "6379:6379"
    volumes:
      - reviewbot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reviewbot_pg_data:
  reviewbot_redis_data:
